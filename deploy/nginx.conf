worker_processes 1;
pid /tmp/nginx.pid;
# Capability URLs and credentials must never appear in proxy logs.
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    resolver 127.0.0.11 valid=5s ipv6=off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 190s;
    proxy_send_timeout 65s;
    proxy_buffering off;
    proxy_http_version 1.1;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_conn_zone $server_name zone=connections:64k;
    limit_conn connections 16;
    server {
        listen 8080;
        location = /gateway-health { return 200 'ok'; }
        location / {
            set $runtime http://runtime:8080;
            proxy_pass $runtime;
            proxy_set_header Host $http_host;
        }
    }
    server {
        listen 8501;
        location / {
            # Resolve lazily: the optional web profile may not be running.
            set $web http://web:8501;
            proxy_pass $web;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
